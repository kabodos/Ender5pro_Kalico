[gcode_macro M600]
description: Cambio manual de filamento

gcode:

    LUCES_CAMBIO_FILAMENTO

    {% set X = params.X|default(printer.toolhead.axis_maximum.x - 2)|float %}
    {% set Y = params.Y|default(printer.toolhead.axis_minimum.y + 58)|float %}
    {% set Z = params.Z|default(20)|float %}

    SAVE_GCODE_STATE NAME=M600_state

    M117 Pausando impresion...

    PAUSE

    G91
    G1 Z{Z} F1200
    G90

    G1 X{X} Y{Y} F6000

    G91

    ; Retraccion larga para sacar el filamento
    G1 E-45 F1800

    M117 Cambia filamento

    RESPOND MSG="1. Retira el filamento."
    RESPOND MSG="2. Inserta el nuevo."
    RESPOND MSG="3. Purga hasta el color correcto."
    RESPOND MSG="4. Limpia el nozzle."
    RESPOND MSG="5. Pulsa RESUME."