[gcode_macro VERIFY_RUNOUT]
gcode:
    {% if printer["gcode_macro AFS_STATE"].filament_change|int == 0 %}
        G4 P1000
        QUERY_FILAMENT_SENSOR SENSOR=runout
        VERIFY_RUNOUT_CHECK
    {% endif %}


[gcode_macro VERIFY_RUNOUT_CHECK]
gcode:
    {% if printer["gcode_macro AFS_STATE"].filament_change|int == 0 %}
        {% if not printer["filament_switch_sensor runout"].filament_detected %}
            RESPOND TYPE=echo MSG="RUNOUT CONFIRMADO"
            M600
        {% else %}
            RESPOND TYPE=echo MSG="FALSO RUNOUT IGNORADO"
        {% endif %}
    {% endif %}


