[gcode_macro AFS]
description: Apollo Filament Suite - Variables Globales

###############################
# Información
###############################

variable_version: "1.0.0"
variable_build: 1

###############################
# Opciones
###############################

variable_debug: 0
variable_enable_messages: 1
variable_enable_leds: 1

###############################
# Estado del sistema
###############################

variable_state: "IDLE"

# Estados posibles:
#
# IDLE
# PRINTING
# PAUSED
# M600
# LOADING
# UNLOADING
# PURGING

###############################
# Material actual
###############################

variable_material: "PLA"

###############################
# Temperaturas
###############################

# Temperatura durante pausas largas
variable_pause_temp:170

# Tiempo para bajar temperatura (segundos)
variable_pause_timeout:180

###############################
# PARK
###############################

variable_park_x:218
variable_park_y:58
variable_park_z:20

###############################
# MINI WIPE
###############################

variable_wipe_distance:2.0
variable_wipe_speed:1800

###############################
# SMART PRIME
###############################

variable_prime:0.30

###############################
# SMART PURGE
###############################

variable_purge_length:8

###############################
# SMART LOAD
###############################

variable_load_fast_length:90
variable_load_fast_speed:4200

variable_load_slow_length:15
variable_load_slow_speed:300

###############################
# SMART UNLOAD
###############################

# Empuje previo
variable_push_length:6

# Romper presión
variable_break_length:2

# Longitud total descarga
variable_unload_length:105

# Velocidades
variable_unload_fast_speed:4800
variable_unload_medium_speed:2400
variable_unload_slow_speed:900

###############################
# M600
###############################

variable_prime_after_m600:0.30

###############################
# Debug
###############################

variable_last_action:"NONE"

gcode: