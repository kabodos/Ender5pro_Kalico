#####################################################################
# M600
#####################################################################

[gcode_macro M600]
description: Apollo Filament Change

gcode:

    #################################################################
    # Verificar temperatura
    #################################################################

    {% if not printer.extruder.can_extrude %}
        { action_raise_error("El hotend no está suficientemente caliente.") }
    {% endif %}

    #################################################################
    # Mensaje
    #################################################################

    M117 Iniciando cambio de filamento...

    #################################################################
    # Pausar impresión
    #################################################################

    PAUSE

    #################################################################
    # Descargar filamento
    #################################################################

    UNLOAD_FILAMENT

    #################################################################
    # Esperar al usuario
    #################################################################

    RESPOND TYPE=command MSG="action:prompt_begin Cambio de Filamento"

    RESPOND TYPE=command MSG="action:prompt_text"

    RESPOND TYPE=command MSG="Retire el filamento."

    RESPOND TYPE=command MSG="Inserte el nuevo filamento."

    RESPOND TYPE=command MSG=""

    RESPOND TYPE=command MSG="Ejecute LOAD_FILAMENT"

    RESPOND TYPE=command MSG=""

    RESPOND TYPE=command MSG="Cuando termine..."

    RESPOND TYPE=command MSG="Pulse RESUME"

    RESPOND TYPE=command MSG="action:prompt_show"
