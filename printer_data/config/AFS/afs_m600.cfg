#####################################################################
#
# Apollo Filament Suite
#
# Archivo : afs_m600.cfg
# Version : 2.0
#
#####################################################################

[gcode_macro M600]
description: Apollo Filament Change

gcode:

    ############################################################
    # Verificar temperatura
    ############################################################

    {% if not printer.extruder.can_extrude %}
        { action_raise_error("El hotend no está suficientemente caliente.") }
    {% endif %}

    ############################################################
    # Mensaje
    ############################################################

    M117 Cambio de filamento...

    ############################################################
    # Pausar impresión
    ############################################################

    PAUSE

    ############################################################
    # Elevar Z de forma segura
    ############################################################

    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_hop = 15.0 %}

    G91

    {% if act_z < (max_z - z_hop) %}
        G1 Z{z_hop} F900
    {% else %}
        G1 Z{max_z - act_z} F900
    {% endif %}

    G90

    ############################################################
    # Llevar cabezal al frente
    ############################################################

    G1 X117 Y5 F6000

    ############################################################
    # Descargar filamento
    ############################################################

    UNLOAD_FILAMENT

    ############################################################
    # Mensaje
    ############################################################

    M117 Inserte el nuevo filamento y ejecute LOAD_FILAMENT
