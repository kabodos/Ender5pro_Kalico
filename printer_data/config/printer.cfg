# **********************************************************************************
# Eddy ng
# **********************************************************************************

[mcu eddy]
# FOR USB: replace this with your serial port ID
# FOR CANBUS: replace this with your canbus UUID
serial: /dev/serial/by-id/usb-Klipper_rp2040_504450593069E11C-if00
restart_method: command
is_non_critical: True

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -45 #-42 # INSERT VALUE FOR YOUR PROBE POSITION
y_offset: 14 #0 # INSERT VALUE FOR YOUR PROBE POSITION 
# --- Ajustes para Estabilidad ---
tap_samples: 7
tap_max_samples: 15
tap_samples_stddev: 0.030
#tap_samples: 20          # Aumentado para mejor promedio (def: 10)
#tap_max_samples: 50      # Reintenta más veces antes de fallar
#tap_samples_stddev: 0.080 # Umbral tolerante para tu error de 0.055

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26


# **********************************************************************************
# Eddy ng
# **********************************************************************************

#####################################################################
# Sensor de fin de filamento
#####################################################################

[filament_switch_sensor runout]

switch_pin: ^PC15
pause_on_runout: False

runout_gcode:
    M117 Sin filamento
    M600

insert_gcode:
    M117 Filamento detectado

#####################################################################
# Sensor de fin de filamento
#####################################################################

[safe_z_home]
home_xy_position: 162, 114 #156, 108 #114,104 #78,108.50 #115,117.50 #this should be the center of your bed
speed: 50 
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 12,40 #5, 19 #-41, -1 #10, 10       #!!min and max co-ords are based on the probes location not the nozzle!!
mesh_max: 181, 213 #186, 208 #228, 208 #230, 219  #needs to be calibrated for your individual printer
probe_count: 10, 10 #5,5 #this is the number of probing points on X then Y axis
algorithm: bicubic
#mesh_pps: 2,2
#fade_start: 1.0
#fade_end: 10
#fade_target: 0

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 39.74 #39.72 #40
endstop_pin: ^PC0
position_endstop: 226 #228 #0
position_max: 226 #228 #235
#position_min: -2
homing_speed: 50

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 39.79 #39.8 #40
endstop_pin: ^PC1
position_endstop: 218 #225 #235 #208 #0
position_max: 218 #225 #235 #208 #235
position_min: -12 #-18
homing_speed: 50

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 4 #5.56 #4 #4.42 #4 #4 #8
full_steps_per_rotation: 200 # 200 para motores de 1.8° (estándar Creality)
                             # 400 si tuvieras motores de 0.9° (alta precisión)
# endstop_pin: ^PC2
# position_endstop: 0.0
endstop_pin: probe:z_virtual_endstop
position_max: 310 #250
position_min: -5           # Permite que el eje baje para calibrar el Eddy
homing_speed: 8            # Velocidad segura para homing con sensor inductivo


[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
#microsteps: 16
#rotation_distance: 7.712#33.500
#nozzle_diameter: 0.400
#filament_diameter: 1.750
microsteps:16
rotation_distance: 5.780 #5.7 ##rotation_distance: 23.967
#gear_ratio: 50:17
full_steps_per_rotation: 200  #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0
max_extrude_cross_section: 5
#control: pid
#pid_Kp: 14.669
#pid_Ki: 0.572
#pid_Kd: 94.068
min_temp: 0
max_temp: 280
max_extrude_only_distance: 500

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
hold_current: 0.500
stealthchop_threshold: 999999
sense_resistor: 0.110

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
hold_current: 0.500
stealthchop_threshold: 999999
sense_resistor: 0.110

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.650 #0.580      # Corriente recomendada para el motor Z
interpolate: False             # Mantener en False para evitar desfases en Kalico
hold_current: 0.500
stealthchop_threshold: 999999
sense_resistor: 0.110

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
hold_current: 0.500
stealthchop_threshold: 999999
sense_resistor: 0.110

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F #ATC Semitec 104GT-2
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_4C0030000950414733303120-if00
#serial: /dev/ttyS5 #/dev/ph-uart5
#serial: /dev/ttyAMA0
restart_method: command

#[mcu rpi]
#serial: /tmp/klipper_host_mcu

#[output_pin BEEPER_Pin]
#pin: gpiochip0/PI13 #rpi:gpio261 # for Raspberry Pi
#pin: host:gpio22
#pwm: True
#pwm: False

[skew_correction]

[screws_tilt_adjust]
screw1: 69,20 #73,20
screw1_name: front left screw
screw2: 228,20
screw2_name: front right screw
screw3: 228,193
screw3_name: rear right screw
screw4: 69,193 #,193
screw4_name: rear left screw
horizontal_move_z: 10
speed: 100
screw_thread: CW-M4

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

